server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API calls and health checks go to the backend service (see ../docker/docker-compose.yaml).
    # Browser and API share one origin, so the backend needs no CORS setup here.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://backend:8080;
    }

    # Hashed build output never changes, so browsers may cache it forever.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html and the client router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
